<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎈</title>
<style>
* { box-sizing: border-box; }

/* Emojis are a full-screen animated layer, behind the message. */
.emoji-background {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.emoji-background span {
  position: absolute;
  bottom: -12vh;
  left: var(--left, 50%);
  display: block;
  font-size: var(--size, 25px);
  opacity: .72;
  will-change: transform;
  animation: emojiRise var(--duration, 10s) linear var(--delay, 0s) infinite;
}

.emoji-background span:nth-child(1) { --left: 4%; --duration: 11s; --delay: -8s; --size: 24px; }
.emoji-background span:nth-child(2) { --left: 13%; --duration: 8s; --delay: -2s; --size: 20px; }
.emoji-background span:nth-child(3) { --left: 22%; --duration: 12s; --delay: -10s; --size: 27px; }
.emoji-background span:nth-child(4) { --left: 31%; --duration: 9s; --delay: -5s; --size: 23px; }
.emoji-background span:nth-child(5) { --left: 40%; --duration: 13s; --delay: -7s; --size: 26px; }
.emoji-background span:nth-child(6) { --left: 49%; --duration: 10s; --delay: -1s; --size: 22px; }
.emoji-background span:nth-child(7) { --left: 58%; --duration: 8.5s; --delay: -6s; --size: 24px; }
.emoji-background span:nth-child(8) { --left: 67%; --duration: 12s; --delay: -3s; --size: 28px; }
.emoji-background span:nth-child(9) { --left: 76%; --duration: 9.5s; --delay: -9s; --size: 24px; }
.emoji-background span:nth-child(10) { --left: 85%; --duration: 11s; --delay: -4s; --size: 22px; }
.emoji-background span:nth-child(11) { --left: 93%; --duration: 8s; --delay: -6s; --size: 26px; }
.emoji-background span:nth-child(12) { --left: 8%; --duration: 13s; --delay: -1s; --size: 20px; }
.emoji-background span:nth-child(13) { --left: 28%; --duration: 10s; --delay: -8s; --size: 25px; }
.emoji-background span:nth-child(14) { --left: 46%; --duration: 9s; --delay: -3s; --size: 21px; }
.emoji-background span:nth-child(15) { --left: 64%; --duration: 12s; --delay: -11s; --size: 25px; }
.emoji-background span:nth-child(16) { --left: 82%; --duration: 8.5s; --delay: -2s; --size: 23px; }
.emoji-background span:nth-child(17) { --left: 17%; --duration: 10s; --delay: -4s; --size: 26px; }
.emoji-background span:nth-child(18) { --left: 37%; --duration: 12s; --delay: -9s; --size: 22px; }
.emoji-background span:nth-child(19) { --left: 72%; --duration: 9s; --delay: -5s; --size: 27px; }
.emoji-background span:nth-child(20) { --left: 90%; --duration: 11s; --delay: -7s; --size: 24px; }

@keyframes emojiRise {
  0% { transform: translate3d(0, 0, 0) rotate(0deg); }
  25% { transform: translate3d(22px, -28vh, 0) rotate(12deg); }
  50% { transform: translate3d(-18px, -58vh, 0) rotate(-10deg); }
  75% { transform: translate3d(20px, -88vh, 0) rotate(8deg); }
  100% { transform: translate3d(-12px, -125vh, 0) rotate(-8deg); }
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  display: grid;
  place-items: center;
  font-family: Georgia, "Times New Roman", serif;
  color: #b95578;
  background: linear-gradient(145deg, #fffdfd, #fff0f4, #fce7ef);
}

.scene {
  z-index: 1;
  width: 100%;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  position: relative;
}

.content {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 400px;
  text-align: center;
}

h1 {
  font-size: clamp(25px, 6vw, 32px);
  font-weight: normal;
  margin: 0 0 8px;
}

.subtitle {
  color: #b27d8d;
  font-size: 14px;
  margin: 0;
}

.balloon-area {
  height: 260px;
  max-width: 350px;
  margin: 20px auto 5px;
  position: relative;
}

.message {
  position: absolute;
  z-index: 1;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: clamp(26px, 7vw, 35px);
  font-style: italic;
  font-weight: bold;
  line-height: 1.1;
}

.message span {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .5s ease, transform .5s ease;
}

.message span.revealed {
  opacity: 1;
  transform: translateY(0);
}

.balloon {
  --color: #a8ded8;
  position: absolute;
  width: 66px;
  height: 82px;
  border: 1px solid #ffffffd9;
  border-radius: 50%;
  background: var(--color);
  box-shadow: inset -8px -7px 0 #00000009, 0 8px 17px #b58c9b1c;
  cursor: pointer;
  padding: 0;
  z-index: 2;
  transform-origin: 50% 90%;
  animation: float 2.4s ease-in-out infinite alternate;
  -webkit-tap-highlight-color: transparent;
}

.balloon::before {
  content: "";
  position: absolute;
  top: 12px;
  left: 13px;
  width: 11px;
  height: 22px;
  border-radius: 50%;
  background: #ffffff8c;
  transform: rotate(24deg);
}

.balloon::after {
  content: "";
  position: absolute;
  left: 27px;
  bottom: -8px;
  border-left: 5px solid transparent;
  border-right: 5px solid transparent;
  border-top: 9px solid var(--color);
}

.string {
  position: absolute;
  left: 32px;
  top: 80px;
  height: 33px;
  width: 1px;
  background: #c6a9b3;
}

.balloon:nth-of-type(1) {
  left: calc(50% - 82px);
  top: 47px;
  --color: #a8ded8;
  animation-delay: -.3s;
}

.balloon:nth-of-type(2) {
  left: calc(50% + 10px);
  top: 43px;
  --color: #c8c0f5;
  animation-delay: -1.1s;
}

.balloon:nth-of-type(3) {
  left: calc(50% - 43px);
  top: 3px;
  --color: #f5b4c8;
  animation-delay: -.7s;
}

.balloon:nth-of-type(4) {
  left: calc(50% - 3px);
  top: 108px;
  --color: #f2d47a;
  animation-delay: -1.5s;
}

@keyframes float {
  to { translate: 0 -8px; rotate: 2deg; }
}

.balloon.popped {
  animation: pop .3s ease-in forwards;
  pointer-events: none;
}

@keyframes pop {
  30% { transform: scale(1.2); }
  100% { transform: scale(0); opacity: 0; }
}

.heart {
  position: absolute;
  color: #edb5c7;
  opacity: .55;
  font-size: 18px;
  pointer-events: none;
  animation: heartFloat 3s ease-in-out infinite alternate;
}

.heart:nth-child(1) { left: 10%; top: 25%; }
.heart:nth-child(2) { right: 12%; top: 20%; }
.heart:nth-child(3) { left: 15%; bottom: 22%; }
.heart:nth-child(4) { right: 12%; bottom: 25%; }

@keyframes heartFloat {
  to { transform: translateY(-8px); opacity: .8; }
}

/* After all balloons pop, show only the final message. */
body.finished .intro,
body.finished .balloon,
body.finished .heart {
  display: none;
}

body.finished .emoji-background {
  z-index: 1;
}

body.finished .message {
  z-index: 2;
}

body.finished .balloon-area {
  height: 100vh;
  max-width: none;
  width: 100%;
  margin: 0;
  position: fixed;
  inset: 0;
}

body.finished .message {
  position: fixed;
  inset: 0;
  justify-content: center;
  font-size: clamp(30px, 8vw, 42px);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
<main class="scene">
  <span class="heart">♡</span>
  <span class="heart">♥</span>
  <span class="heart">♡</span>
  <span class="heart">♥</span>

  <div class="emoji-background" id="emojiBackground" aria-hidden="true">
    <span>💗</span><span>✨</span><span>🌸</span><span>💕</span>
    <span>🎀</span><span>💖</span><span>⭐</span><span>🦋</span>
    <span>🌷</span><span>💫</span><span>♡</span><span>🌼</span>
    <span>💞</span><span>✨</span><span>🎀</span><span>🌸</span>
    <span>💗</span><span>🫧</span><span>⭐</span><span>💕</span>
  </div>

  <section class="content">
    <div class="intro">
      <h1 id="heading">Pop all 4 balloons</h1>
      <p class="subtitle">A tiny surprise is hiding behind them ♡</p>
    </div>

    <div class="balloon-area">
      <div class="message" aria-live="polite">
        <span id="word1">You</span>
        <span id="word2">are so</span>
        <span id="word3">special</span>
      </div>

      <button class="balloon" aria-label="Pop balloon 1"><i class="string"></i></button>
      <button class="balloon" aria-label="Pop balloon 2"><i class="string"></i></button>
      <button class="balloon" aria-label="Pop balloon 3"><i class="string"></i></button>
      <button class="balloon" aria-label="Pop balloon 4"><i class="string"></i></button>
    </div>
  </section>
</main>
<button class="next-module" id="nextModule" type="button" onclick="location.href='./module3.html'">Continue to the birthday wish →</button>

<script>
const balloons = [...document.querySelectorAll(".balloon")];
const words = [
  document.getElementById("word1"),
  document.getElementById("word2"),
  document.getElementById("word3")
];

let popped = 0;

balloons.forEach((balloon) => {
  balloon.addEventListener("click", () => {
    if (balloon.classList.contains("popped")) return;

    balloon.classList.add("popped");
    popped++;

    // Reveal the message as balloons pop.
    if (popped === 1) words[0].classList.add("revealed");
    if (popped === 2) words[1].classList.add("revealed");
    if (popped === 3) words[2].classList.add("revealed");

    if (popped === balloons.length) {
      // Wait for the last balloon's pop animation, then remove everything
      // except the "You are so special" message and background.
      document.body.classList.add("finished");
    }
  });
});
</script>
</body>
</html>
