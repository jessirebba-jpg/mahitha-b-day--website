
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happiest Birthday Mahiii ❤️</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #moduleFrame {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: none;
    }
  </style>
</head>

<body>
  <audio id="bgMusic" src="./audio.mp3" autoplay loop preload="auto"></audio>

  <iframe
    id="moduleFrame"
    title="Mahiii's Birthday Surprise"
    src="module1.html"
    allow="autoplay; fullscreen"
  ></iframe>

  <script>
    /*
      MAHIII'S BIRTHDAY WEBSITE
      Module 1 → 2 → 3 → 4 → 5 → 6 → 7
    */

    const birthdayModules = [
      "module1.html",
      "module2.html",
      "module3.html",
      "module4.html",
      "module5.html",
      "module6.html",
      "module7.html"
    ];
    const bgMusic = document.getElementById("bgMusic");

bgMusic.volume = 0.45;

bgMusic.play().catch(() => {});

function startBirthdayMusic() {
  if (bgMusic.paused) {
    bgMusic.play().catch(() => {});
  }
}

    const musicFrame = document.getElementById("moduleFrame");

musicFrame.addEventListener("load", () => {
  try {
  musicFrame.contentDocument.addEventListener(
  "click",
  startBirthdayMusic
);

musicFrame.contentDocument.addEventListener(
  "touchstart",
  startBirthdayMusic
);
    );
  } catch (error) {
    console.log("Could not attach music listener.");
  }
});
document.addEventListener("click", startBirthdayMusic);

const frame = document.getElementById("moduleFrame");
let currentModule = 0;

    function goToModule(number) {
      if (number < 0 || number >= birthdayModules.length) {
        return;
      }

      currentModule = number;
      frame.src = birthdayModules[currentModule];
    }

    function nextModule() {
      if (currentModule < birthdayModules.length - 1) {
        goToModule(currentModule + 1);
      }
    }

    function connectModuleButtons() {
      try {
        const doc = frame.contentDocument;

        if (!doc) return;

        // Prevent adding duplicate listeners after the same page reloads.
        if (doc.documentElement.dataset.birthdayConnected === "yes") {
          return;
        }

        doc.documentElement.dataset.birthdayConnected = "yes";

        doc.addEventListener("click", function (event) {
          const button = event.target.closest(
            'button, input[type="button"], input[type="submit"], a'
          );

          if (!button) return;

          const label = (
            button.innerText ||
            button.value ||
            button.getAttribute("aria-label") ||
            ""
          ).trim().toLowerCase().replace(/\s+/g, " ");

          let shouldAdvance = false;

          // MODULE 1: Only "Yes show me" advances.
          if (currentModule === 0) {
            shouldAdvance = /yes\s*,?\s*show\s*me/.test(label);
          }

          // MODULES 2–5: Continue buttons advance to the next module.
          else if (currentModule >= 1 && currentModule <= 4) {
            shouldAdvance = /\bcontinue\b|\bnext module\b/.test(label);
          }

          // MODULE 6: Continue to the final gift module.
          else if (currentModule === 5) {
            shouldAdvance = /\bcontinue\b|\bnext module\b/.test(label);
          }

          // MODULE 7 is the final celebration.
          if (shouldAdvance) {
            event.preventDefault();
            event.stopImmediatePropagation();
            nextModule();
          }
        }, true);

      } catch (error) {
        console.error(
          "Could not connect module buttons. Check that all files are on the same GitHub Pages site.",
          error
        );
      }
    }

    frame.addEventListener("load", connectModuleButtons);
  </script>

</body>
</html>
